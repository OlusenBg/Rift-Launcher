[package]
name = "rift-launcher"
version = "1.0.0"
description = "Rift Launcher — Minecraft mod manager"
authors = ["Modrift"]
license = ""
repository = ""
default-run = "rift-launcher"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rift_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
dirs = "5"

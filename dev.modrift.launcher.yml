app-id: dev.modrift.launcher
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22
command: rift-launcher
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node22/bin
  env:
    CARGO_HOME: /run/build/rift-launcher/cargo
    RUSTUP_HOME: /usr/lib/sdk/rust-stable
    npm_config_nodedir: /usr/lib/sdk/node22

modules:
  - name: rift-launcher
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/rift-launcher/cargo
    build-commands:
      # Configure cargo to use the vendored crates
      - mkdir -p ${CARGO_HOME}
      - |
        cat > ${CARGO_HOME}/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"
        [source.vendored-sources]
        directory = "/run/build/rift-launcher/cargo/vendor"
        EOF
      # Build the Vite frontend offline using the vendored npm cache
      - npm ci --offline --cache=/run/build/rift-launcher/flatpak-node-generator/npm
      - npm run build
      # Build the Tauri/Rust backend offline
      - cargo build --release --offline --manifest-path src-tauri/Cargo.toml
      # Install binary
      - install -Dm755 src-tauri/target/release/rift-launcher /app/bin/rift-launcher
      # Install icons
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/dev.modrift.launcher.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.modrift.launcher.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.modrift.launcher.png
      # Install desktop entry and AppStream metainfo
      - install -Dm644 flatpak/dev.modrift.launcher.desktop /app/share/applications/dev.modrift.launcher.desktop
      - install -Dm644 flatpak/dev.modrift.launcher.metainfo.xml /app/share/metainfo/dev.modrift.launcher.metainfo.xml
    sources:
      - type: dir
        path: .
      # Generated by flatpak-node-generator in CI — see .github/workflows/ci.yml
      - flatpak/generated-sources.json
      # Generated by flatpak-cargo-generator.py in CI
      - flatpak/cargo-sources.json
